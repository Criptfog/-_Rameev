name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Автоматическая подготовка окружения и папок
        run: |
          # 1. Создаем папку www и перемещаем файлы туда, если они лежат в корне
          mkdir -p www
          cp -f index.html manifest.json sw.js www/ 2>/dev/null || true

          # 2. Если package.json отсутствует, создаем его со всеми зависимостями
          if [ ! -f "package.json" ]; then
            npm init -y
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          else
            npm install
          fi

          # 3. Если capacitor.config.json отсутствует, создаем его
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Дневник Rameev" "ru.rameevcollege.dnevnik" --web-dir www
          fi

      - name: Подготовка Android проекта
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnevnik-Rameev-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
